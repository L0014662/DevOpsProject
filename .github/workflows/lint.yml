name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  spotless:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify formatting
        run: mvn -B spotless:check
        working-directory: ./app